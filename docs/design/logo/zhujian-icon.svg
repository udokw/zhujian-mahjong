  <rect x="231" y="204" width="50" height="9" rx="4.5" fill="#E8C97A"/>
  <rect x="231" y="266" width="50" height="9" rx="4.5" fill="#E8C97A"/>
  <rect x="231" y="328" width="50" height="9" rx="4.5" fill="#E8C97A"/>
