  <rect x="150" y="70" width="212" height="372" rx="28" fill="none" stroke="#D8CDB8" stroke-width="2"/>
  <rect x="172" y="92" width="168" height="328" rx="14" fill="none" stroke="#D8CDB8" stroke-width="1.6" opacity=".7"/>

  <!-- 竹叶 -->
  <path d="M262 172 C 296 150 332 150 350 162 C 320 182 288 186 262 172 Z" fill="#1F6B52"/>
  <path d="M248 190 C 214 170 180 174 162 188 C 192 204 224 204 248 190 Z" fill="#1F6B52"/>

  <!-- 竹竿与竹节 -->
