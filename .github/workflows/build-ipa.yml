name: Build unsigned IPA

# 触发方式:
#   1. push 到 main/master
#   2. 手动: Actions -> Build unsigned IPA -> Run workflow
#   3. 打 v* tag: 构建完把 IPA 附到 GitHub Release，方便直接下载安装
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          java -version

      # Gradle 依赖 + Kotlin/Native 工具链体积大，缓存后重跑会快很多。
      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # :app 是 KMP 模块，同时挂了 Android 目标，构建 iOS framework 时也需要 Android SDK。
      - name: Resolve Android SDK for Kotlin Multiplatform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "Android SDK: $SDK"
          test -d "$SDK"
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Build app (no code signing)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        working-directory: iosApp
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/iosApp.app"
          test -d "$APP"

          # 音频资源是按 folder reference 打进 bundle 的 raw/ 目录，这里做一次落地校验，
          # 避免“编译过了但运行时找不到 wav”这种只差最后一步的问题。
          RAWDIR="$APP/raw"
          test -d "$RAWDIR"
          SRC_COUNT=$(find ../app/src/androidMain/res/raw -name '*.wav' | wc -l | tr -d ' ')
          BUNDLE_COUNT=$(find "$RAWDIR" -name '*.wav' | wc -l | tr -d ' ')
          echo "源码 wav: $SRC_COUNT, bundle 内 wav: $BUNDLE_COUNT"
          test "$SRC_COUNT" = "$BUNDLE_COUNT"
          for f in tile_discard_1.wav voice1_tile_00.wav voice9_tile_33.wav win_sting.wav hu.wav; do
            test -f "$RAWDIR/$f" || { echo "bundle 缺失音频: $f"; exit 1; }
          done
          echo "音频资源校验通过"

          # 图标校验：AppIcon 会由 actool 摊成 AppIcon60x60@Nx.png 等文件落到 bundle 根目录。
          # 断言主屏尺寸存在，避免"图标集没被工程引用"这种只在安装后才看得出来问题。
          for f in AppIcon60x60@2x.png AppIcon60x60@3x.png AppIcon29x29@2x.png; do
            test -f "$APP/$f" || { echo "bundle 缺失图标: $f"; exit 1; }
          done
          echo "✓ AppIcon 已打入 bundle"
          ls -lh "$APP"/AppIcon*.png

          rm -rf Payload iosApp-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry iosApp-unsigned.ipa Payload

          echo "--- 版本信息 ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"

          # ---- 产物 Info.plist 断言（防止 1.0.6 启动闪退回归）----
          # Compose Multiplatform 1.7.0 的 PlistSanityCheck 会在启动时校验这一项，
          # 缺失或非 true 会抛 IllegalStateException -> SIGABRT（表现为闪一下灰影后退出）。
          # 这里断言的是“打进 bundle 的产物”，而不是仓库里的模板，避免模板改了却没生效。
          PLIST="$APP/Info.plist"
          CADISABLE=$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$PLIST" 2>/dev/null || true)
          if [ "$CADISABLE" != "true" ]; then
            echo "✗ 产物 Info.plist 的 CADisableMinimumFrameDurationOnPhone 不是 true（实际: '${CADISABLE:-缺失}'）"
            exit 1
          fi
          echo "✓ CADisableMinimumFrameDurationOnPhone = true"

          # 版本号必须与 Config.xcconfig 一致，防止出包时版本号没跟上。
          EXPECTED_MARKETING=$(sed -n 's/^MARKETING_VERSION *= *//p' Config.xcconfig | tr -d '[:space:]')
          EXPECTED_BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' Config.xcconfig | tr -d '[:space:]')
          ACTUAL_MARKETING=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          if [ "$ACTUAL_MARKETING" != "$EXPECTED_MARKETING" ] || [ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "✗ 产物版本与 Config.xcconfig 不一致：产物 ${ACTUAL_MARKETING}(${ACTUAL_BUILD})，期望 ${EXPECTED_MARKETING}(${EXPECTED_BUILD})"
            exit 1
          fi
          echo "✓ 产物版本与 Config.xcconfig 一致：${ACTUAL_MARKETING}(${ACTUAL_BUILD})"

          du -sh iosApp-unsigned.ipa
          ls -lh iosApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: iosApp-unsigned-ipa
          path: iosApp/iosApp-unsigned.ipa
          if-no-files-found: error

      # 只有打 tag 时才创建 Release, 方便直接下载安装
      - name: Attach IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iosApp/iosApp-unsigned.ipa
          generate_release_notes: true
